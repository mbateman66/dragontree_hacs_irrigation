add_station:
  name: Add Station
  description: Add a new station to the irrigation controller.
  fields:
    base_name:
      name: Base Name
      description: OpenSprinkler base name (e.g. front_yard). Used to build entity IDs.
      required: true
      selector:
        text:
    friendly_name:
      name: Friendly Name
      description: Human-readable display name.
      required: true
      selector:
        text:
    schedule_mode:
      name: Schedule Mode
      description: "Off, Normal, or Hot"
      required: false
      selector:
        select:
          options:
            - "Off"
            - "Normal"
            - "Hot"
    sensitive:
      name: Sensitive
      description: If true, station runs in Light rain mode.
      required: false
      selector:
        boolean:

update_station:
  name: Update Station
  description: Update top-level properties of a station.
  fields:
    station_id:
      name: Station ID
      required: true
      selector:
        text:
    base_name:
      name: Base Name
      description: >
        Remap the station to a different OpenSprinkler entity (e.g. after the
        station was renamed in OS or HA). Must match the slugified entity name:
        switch.<base_name>_station_enabled. All entity listeners are
        re-registered immediately.
      required: false
      selector:
        text:
    friendly_name:
      name: Friendly Name
      required: false
      selector:
        text:
    schedule_mode:
      name: Schedule Mode
      required: false
      selector:
        select:
          options:
            - "Off"
            - "Normal"
            - "Hot"
    sensitive:
      name: Sensitive
      required: false
      selector:
        boolean:
    tracked:
      name: Tracked
      description: If false, station is excluded from scheduling.
      required: false
      selector:
        boolean:
    moisture_sensor:
      name: Moisture Sensor Entity ID
      description: Entity ID of a soil moisture sensor. Pass an empty string to clear the association.
      required: false
      selector:
        text:
    moisture_max:
      name: Max Moisture (%)
      description: If the moisture sensor reading exceeds this value the station is skipped (treated as Off).
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    manual_duration:
      name: Manual Run Duration (minutes)
      description: Default duration shown in the Run Stations tab for this station.
      required: false
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

remove_station:
  name: Remove Station
  description: Remove a station from the irrigation controller.
  fields:
    station_id:
      name: Station ID
      required: true
      selector:
        text:

reorder_stations:
  name: Reorder Stations
  description: Set the execution order of stations.
  fields:
    station_ids:
      name: Station IDs
      description: List of station IDs in desired order.
      required: true
      selector:
        object:

update_schedule:
  name: Update Station Schedule
  description: Update the normal or hot schedule for a station.
  fields:
    station_id:
      name: Station ID
      required: true
      selector:
        text:
    schedule_type:
      name: Schedule Type
      description: '"normal" or "hot"'
      required: true
      selector:
        select:
          options:
            - "normal"
            - "hot"
    am:
      name: Include in AM Queue
      required: false
      selector:
        boolean:
    pm:
      name: Include in PM Queue
      required: false
      selector:
        boolean:
    days_of_week:
      name: Days of Week
      description: "List of day numbers: 0=Mon, 1=Tue, ..., 6=Sun"
      required: false
      selector:
        object:
    week_interval:
      name: Week Interval
      description: Run every N weeks.
      required: false
      selector:
        number:
          min: 1
          max: 8
    duration:
      name: Duration (seconds)
      required: false
      selector:
        number:
          min: 0
          max: 36000
          unit_of_measurement: s

move_station:
  name: Move Station
  description: Shift a station one position up or down in the run order.
  fields:
    station_id:
      name: Station ID
      required: true
      selector:
        text:
    direction:
      name: Direction
      description: '"up" or "down"'
      required: true
      selector:
        select:
          options:
            - "up"
            - "down"

discard_flow_run:
  name: Discard Flow Run
  description: >
    Mark a specific flow monitoring run as discarded so it is excluded from
    the station's baseline. Use this to remove runs that were recorded under
    unusual conditions (e.g. a zone valve was manually closed). The run_id
    can be found in the recent_run_details attribute of the station's Flow
    Status sensor.
  fields:
    station_id:
      name: Station ID
      description: The station whose run should be discarded.
      required: true
      selector:
        text:
    run_id:
      name: Run ID
      description: UUID of the run to discard (from the recent_run_details sensor attribute).
      required: true
      selector:
        text:

discard_flow_runs_before:
  name: Discard Flow Runs Before
  description: >
    Discard all flow runs for a station that are older than the given run.
    Use this after adding or removing drippers/sprinklers to start the
    baseline fresh from a known-good run.
  fields:
    station_id:
      name: Station ID
      description: The station to update.
      required: true
      selector:
        text:
    run_id:
      name: Run ID
      description: The run to anchor at — all runs older than this one are discarded.
      required: true
      selector:
        text:

start_station:
  name: Start Station
  description: Manually start a station outside the scheduled queue. Blocked if a queue or any station is already running.
  fields:
    station_id:
      name: Station ID
      required: true
      selector:
        text:
    duration_seconds:
      name: Duration (seconds)
      required: true
      selector:
        number:
          min: 60
          max: 7200
          unit_of_measurement: s

stop_station:
  name: Stop Station
  description: Stop whatever station is currently running. If a queue is active, the current station is marked cancelled and the queue advances to the next station. No-op if nothing is running.
